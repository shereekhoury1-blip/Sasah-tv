<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0F0F1A">
<title>أفلامي</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { font-family:-apple-system,'Segoe UI',Tahoma,sans-serif; background:#0F0F1A; color:#fff; min-height:100vh; padding-bottom:90px; }
header { padding:16px; display:flex; justify-content:space-between; align-items:center; background:#0F0F1A; position:sticky; top:0; z-index:10; border-bottom:1px solid #1C1C2E; }
h1 { font-size:22px; } h1 span { color:#E50914; }
.fav-btn { background:#1C1C2E; border:none; color:#E50914; font-size:22px; padding:8px 12px; border-radius:12px; cursor:pointer; }
.search-box { margin:12px 16px; position:relative; }
.search-box input { width:100%; padding:12px 16px; background:#1C1C2E; border:none; border-radius:12px; color:#fff; font-size:15px; font-family:inherit; }
.section { margin:20px 0; }
.section h2 { font-size:18px; padding:0 16px 12px; }
.row { display:flex; overflow-x:auto; gap:12px; padding:0 16px; scrollbar-width:none; }
.row::-webkit-scrollbar { display:none; }
.card { flex:0 0 130px; cursor:pointer; }
.card:active { transform:scale(.95); }
.card img,.card .no-img { width:130px; height:180px; object-fit:cover; border-radius:12px; background:#1C1C2E; display:flex; align-items:center; justify-content:center; font-size:40px; }
.card p { margin-top:6px; font-size:13px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.empty { text-align:center; padding:60px 20px; color:#666; }
.empty div { font-size:60px; margin-bottom:16px; }
.fab { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#E50914; color:#fff; border:none; padding:14px 28px; border-radius:30px; font-size:16px; font-weight:700; cursor:pointer; box-shadow:0 8px 24px rgba(229,9,20,.5); font-family:inherit; z-index:20; }
.modal { position:fixed; inset:0; background:rgba(0,0,0,.85); display:none; align-items:flex-end; z-index:100; }
.modal.active { display:flex; }
.modal-content { background:#15152A; width:100%; max-height:92vh; border-radius:24px 24px 0 0; padding:20px; overflow-y:auto; }
.modal-content h3 { margin-bottom:16px; font-size:18px; display:flex; justify-content:space-between; align-items:center; }
.close-btn { background:none; border:none; color:#888; font-size:26px; cursor:pointer; }
.tabs { display:flex; gap:8px; margin-bottom:16px; }
.tab { flex:1; padding:10px; background:#1C1C2E; border:none; border-radius:10px; color:#aaa; font-size:14px; cursor:pointer; font-family:inherit; }
.tab.active { background:#E50914; color:#fff; }
.field { margin-bottom:12px; }
.field label { display:block; font-size:13px; margin-bottom:6px; color:#aaa; }
.field input,.field textarea { width:100%; padding:12px; background:#1C1C2E; border:1px solid #2A2A44; border-radius:10px; color:#fff; font-size:14px; font-family:inherit; }
.field textarea { resize:vertical; min-height:70px; }
.save-btn { width:100%; padding:14px; background:#E50914; color:#fff; border:none; border-radius:12px; font-size:16px; font-weight:700; cursor:pointer; margin-top:8px; font-family:inherit; }
.details-hero { width:100%; height:260px; object-fit:cover; border-radius:16px; background:#1C1C2E; display:flex; align-items:center; justify-content:center; font-size:80px; margin-bottom:16px; }
.details-title { font-size:22px; font-weight:700; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; }
.details-title button { background:none; border:none; font-size:26px; cursor:pointer; }
.chip { display:inline-block; padding:6px 14px; background:#1C1C2E; border-radius:20px; font-size:13px; margin-bottom:16px; }
.desc { font-size:15px; line-height:1.7; color:#ccc; margin-bottom:20px; }
.play-btn { width:100%; padding:16px; background:#E50914; color:#fff; border:none; border-radius:12px; font-size:17px; font-weight:700; cursor:pointer; font-family:inherit; }
video { width:100%; border-radius:12px; margin-bottom:16px; background:#000; }
.toast { position:fixed; bottom:100px; left:50%; transform:translateX(-50%); background:#E50914; color:#fff; padding:12px 24px; border-radius:30px; font-size:14px; opacity:0; transition:all .3s; pointer-events:none; z-index:200; }
.toast.show { opacity:1; }
</style>
</head>
<body>
<header>
  <h1>أفلام<span>ي</span></h1>
  <button class="fav-btn" onclick="showFavs()">❤</button>
</header>
<div class="search-box">
  <input type="text" id="search" placeholder="ابحث..." oninput="render()">
</div>
<div id="content"></div>
<button class="fab" onclick="openAdd()">+ إضافة</button>
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-content" id="modalBody"></div>
</div>
<div class="toast" id="toast"></div>
<script>
let media = JSON.parse(localStorage.getItem('media') || '[]');
let currentType = 'movie';
function save(){ localStorage.setItem('media',JSON.stringify(media)); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2000); }
function render(){
  const q = document.getElementById('search').value.trim();
  const filtered = media.filter(m=>m.title.includes(q));
  const movies = filtered.filter(m=>m.type==='movie');
  const series = filtered.filter(m=>m.type==='series');
  const content = document.getElementById('content');
  if(media.length===0){ content.innerHTML='<div class="empty"><div>🎬</div><p>لا يوجد محتوى بعد</p><p>اضغط إضافة</p></div>'; return; }
  let html='';
  if(movies.length>0){ html+='<div class="section"><h2>🎥 أفلام</h2><div class="row">'+movies.map(card).join('')+'</div></div>'; }
  if(series.length>0){ html+='<div class="section"><h2>📺 مسلسلات</h2><div class="row">'+series.map(card).join('')+'</div></div>'; }
  content.innerHTML = html || '<div class="empty"><div>🔍</div><p>لا توجد نتائج</p></div>';
}
function card(m){
  const img = m.image ? '<img src="'+m.image+'" onerror="this.outerHTML=\'<div class=&quot;no-img&quot;>🎬</div>\'">' : '<div class="no-img">🎬</div>';
  return '<div class="card" onclick="showDetails(\''+m.id+'\')">'+img+'<p>'+m.title+'</p></div>';
}
function openAdd(){
  currentType='movie';
  document.getElementById('modalBody').innerHTML = '<h3>إضافة جديد <button class="close-btn" onclick="closeModal()">✕</button></h3>'+
    '<div class="tabs"><button class="tab active" id="tab-movie" onclick="setType(\'movie\')">🎥 فيلم</button><button class="tab" id="tab-series" onclick="setType(\'series\')">📺 مسلسل</button></div>'+
    '<div class="field"><label>الاسم *</label><input id="f-title" placeholder="الاسم"></div>'+
    '<div class="field"><label>الوصف</label><textarea id="f-desc" placeholder="الوصف"></textarea></div>'+
    '<div class="field"><label>رابط الصورة</label><input id="f-image" placeholder="https://..." type="url"></div>'+
    '<div class="field"><label>رابط الفيديو *</label><input id="f-video" placeholder="https://...mp4" type="url"></div>'+
    '<button class="save-btn" onclick="saveMedia()">حفظ</button>';
  document.getElementById('modal').classList.add('active');
}
function setType(t){
  currentType=t;
  document.getElementById('tab-movie').classList.toggle('active',t==='movie');
  document.getElementById('tab-series').classList.toggle('active',t==='series');
}
function saveMedia(){
  const title=document.getElementById('f-title').value.trim();
  const desc=document.getElementById('f-desc').value.trim();
  const image=document.getElementById('f-image').value.trim();
  const video=document.getElementById('f-video').value.trim();
  if(!title||!video){ toast('الاسم والفيديو مطلوبان'); return; }
  media.push({id:Date.now().toString(),title,desc,image,video,type:currentType,favorite:false});
  save(); closeModal(); render(); toast('تمت الإضافة');
}
function showDetails(id){
  const m = media.find(x=>x.id===id);
  document.getElementById('modalBody').innerHTML = '<h3>'+(m.type==='movie'?'🎥 فيلم':'📺 مسلسل')+' <button class="close-btn" onclick="closeModal()">✕</button></h3>'+
    (m.image?'<img src="'+m.image+'" class="details-hero" onerror="this.outerHTML=\'<div class=&quot;details-hero&quot;>🎬</div>\'">':'<div class="details-hero">🎬</div>')+
    '<div class="details-title"><span>'+m.title+'</span><button onclick="toggleFav(\''+m.id+'\')">'+(m.favorite?'❤':'🤍')+'</button></div>'+
    '<div class="chip">'+(m.type==='movie'?'🎥 فيلم':'📺 مسلسل')+'</div>'+
    '<div class="desc">'+(m.desc||'لا يوجد وصف')+'</div>'+
    '<div id="playerArea"></div>'+
    '<button class="play-btn" id="playBtn" onclick="playVideo(\''+m.id+'\')">▶ تشغيل</button>'+
    '<button class="save-btn" style="background:#2A2A44;margin-top:10px" onclick="deleteMedia(\''+m.id+'\')">🗑 حذف</button>';
  document.getElementById('modal').classList.add('active');
}
function playVideo(id){
  const m=media.find(x=>x.id===id);
  const area=document.getElementById('playerArea');
  if(area.innerHTML){ area.innerHTML=''; document.getElementById('playBtn').textContent='▶ تشغيل'; return; }
  area.innerHTML='<video controls autoplay playsinline src="'+m.video+'"></video>';
  document.getElementById('playBtn').textContent='⏹ إغلاق';
}
function toggleFav(id){ const m=media.find(x=>x.id===id); m.favorite=!m.favorite; save(); showDetails(id); toast(m.favorite?'❤ أضيف':'🤍 أزيل'); }
function deleteMedia(id){ if(!confirm('حذف؟'))return; media=media.filter(m=>m.id!==id); save(); closeModal(); render(); toast('تم الحذف'); }
function showFavs(){
  const favs=media.filter(m=>m.favorite);
  let html = '<h3>❤ المفضلة <button class="close-btn" onclick="closeModal()">✕</button></h3>';
  if(favs.length===0){ html+='<div class="empty"><div>🤍</div><p>لا يوجد</p></div>'; }
  else { html+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">'+favs.map(m=>'<div class="card" style="flex:none;width:100%" onclick="showDetails(\''+m.id+'\')">'+(m.image?'<img src="'+m.image+'" style="width:100%;height:180px">':'<div class="no-img" style="width:100%;height:180px">🎬</div>')+'<p>'+m.title+'</p></div>').join('')+'</div>'; }
  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('modal').classList.add('active');
}
function closeModal(){ document.getElementById('modal').classList.remove('active'); }
render();
</script>
</body>
</html>
